# Runs OpenIVM's cost_model_benchmark on the ivm-bench self-hosted runners.
#
# Independent of GCI: it shares only the runner label and the pinned build toolchain in
# src/containers/duckdb-openivm, and touches none of GCI's inputs, secrets or containers.
#
# workflow_dispatch only fires for workflows present on the default branch, so this has to be merged
# before it can be dispatched against any ref.

name: OpenIVM cost model sweep

on:
  workflow_dispatch:
    inputs:
      openivm_ref:
        description: "openivm branch, tag or commit to build"
        default: "ila/cost-model-sweep-build"
        type: string
      scale_factors:
        description: "JSON array of TPC-C scale factors; each becomes its own shard"
        default: '["1","10","25","50","100"]'
        type: string
      delta_pcts:
        description: "Delta sizes as a percentage of the base table"
        default: "1,2,5"
        type: string
      reps:
        description: "Repetitions per cell"
        default: "3"
        type: string
      batch:
        description: "Query set: all | validated | todo"
        default: "all"
        type: string
      configs:
        description: "Flag configurations to sweep"
        default: "all_on"
        type: string
      timeout_minutes:
        description: "Per-shard timeout"
        default: "1200"
        type: string

# One group per ref, so two dispatches of the same ref queue instead of fighting over a runner.
# Deliberately no cancel-in-progress: GCI cancels because a newer benchmark supersedes an older one,
# but a sweep shard several hours in holds results worth more than a fast restart.
concurrency:
  group: cost-model-sweep-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  sweep:
    runs-on: [self-hosted, Linux, X64, ivm-bench-azure]
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    strategy:
      fail-fast: false
      # Two runners carry this label, so two shards run at once and the rest queue. A shard is one
      # scale factor: the unit we are willing to lose to a runner restart, which PROVENANCE.md
      # records happening partway through a previous SF100 run.
      max-parallel: 2
      matrix:
        scale: ${{ fromJSON(inputs.scale_factors) }}

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: "🔧 Build OpenIVM at ${{ inputs.openivm_ref }}"
        run: |
          set -euo pipefail
          # Reuse the pinned toolchain from the duckdb-openivm image: Ubuntu 22.04 for GLIBC 2.35 and
          # GCC 13, which lpts needs. Stopping at the builder stage keeps the whole build tree,
          # including the benchmark binaries that the published runtime image does not carry.
          docker build \
            --target builder \
            --build-arg OPENIVM_REPO=https://github.com/ila/openivm.git \
            --build-arg OPENIVM_COMMIT="${{ inputs.openivm_ref }}" \
            -t "openivm-costmodel:${{ github.run_id }}" \
            src/containers/duckdb-openivm

      - name: "📊 Sweep at scale factor ${{ matrix.scale }}"
        run: |
          set -euo pipefail
          mkdir -p out
          # The benchmark flushes a CSV row per completed case, so a shard cut short by a timeout or a
          # runner restart still leaves every finished cell on disk.
          docker run --rm \
            -v "$PWD/out:/out" \
            "openivm-costmodel:${{ github.run_id }}" \
            /src/build/release/extension/openivm/cost_model_benchmark \
              --scale "${{ matrix.scale }}" \
              --delta-pcts "${{ inputs.delta_pcts }}" \
              --reps "${{ inputs.reps }}" \
              --batch "${{ inputs.batch }}" \
              --configs "${{ inputs.configs }}" \
              --out "/out/cost_model_sf${{ matrix.scale }}.csv" \
            2>&1 | tee "out/cost_model_sf${{ matrix.scale }}.log"

      - name: "📈 Summarise"
        if: always()
        run: |
          python3 - <<'PY'
          import csv, collections, os, statistics
          path = "out/cost_model_sf${{ matrix.scale }}.csv"
          if not os.path.exists(path):
              print("no results file"); raise SystemExit(0)
          rows = list(csv.DictReader(open(path)))
          if not rows:
              print("no rows"); raise SystemExit(0)
          bad = [r for r in rows if r["error"]]
          agree = sum(1 for r in rows if (r["best_method"] == "full") == (r["auto_method"] == "full"))
          reg = sorted(float(r["regret_ratio"]) for r in rows if r["regret_ratio"] and float(r["regret_ratio"]) > 0)
          print(f"cases {len(rows)}, errors {len(bad)} {dict(collections.Counter(r['query_id'] for r in bad))}")
          print(f"decision agreement {100*agree/len(rows):.1f}%")
          if reg:
              print(f"regret mean {statistics.mean(reg):.3f} p95 {reg[int(0.95*len(reg))]:.2f} max {reg[-1]:.2f}")
          print("fastest strategy:", dict(collections.Counter(r["best_method"] for r in rows)))
          PY

      - name: "📦 Upload results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cost-model-sf${{ matrix.scale }}
          path: |
            out/cost_model_sf${{ matrix.scale }}.csv
            out/cost_model_sf${{ matrix.scale }}.log
          if-no-files-found: warn
          retention-days: 30

      - name: "🧹 Drop the build image"
        if: always()
        run: docker image rm -f "openivm-costmodel:${{ github.run_id }}" || true
