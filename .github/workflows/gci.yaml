name: GCI
on:
  workflow_dispatch:
    inputs:
      control_since:
        description: "Observe the unique OpenIVM Fabric control submitted after this UTC timestamp; empty reads historical sessions once"
        type: string
        default: ""
permissions:
  contents: read
jobs:
  fabric-history:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: fabric-history-readonly
      - name: Read existing Fabric sessions (no benchmark)
        env:
          BASE64_ENV: ${{ secrets.BASE64_ENV }}
          CONTROL_SINCE: ${{ inputs.control_since }}
        working-directory: fabric-history-readonly
        run: python3 tools/scripts/fabric-history-diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-history-diagnostic
          path: fabric-history-readonly/fabric-history-diagnostic.json
          retention-days: 30
