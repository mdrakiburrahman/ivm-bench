name: GCI
on:
  workflow_dispatch:
    inputs:
      control_since:
        description: "Observe the unique OpenIVM Fabric control submitted after this UTC timestamp; empty reads historical sessions once"
        type: string
        default: ""
      once:
        description: "Read one current snapshot and upload it immediately"
        type: boolean
        default: false
      settings_only:
        description: "Read workspace Spark compute settings only; no sessions or benchmark"
        type: boolean
        default: false
      control_run_id:
        description: "Existing benchmark run ID to observe; never starts a benchmark"
        type: string
        default: "37382082873"
permissions:
  contents: read
  actions: read
jobs:
  fabric-history:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: fabric-history-readonly
      - name: Read existing Fabric sessions (no benchmark)
        env:
          BASE64_ENV: ${{ secrets.BASE64_ENV }}
          CONTROL_SINCE: ${{ inputs.control_since }}
          GH_TOKEN: ${{ github.token }}
          OBSERVE_ONCE: ${{ inputs.once }}
          SETTINGS_ONLY: ${{ inputs.settings_only }}
          CONTROL_RUN_ID: ${{ inputs.control_run_id }}
        working-directory: fabric-history-readonly
        run: python3 tools/scripts/fabric-history-diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-history-diagnostic
          path: |
            fabric-history-readonly/fabric-history-diagnostic.json
            fabric-history-readonly/fabric-history-diagnostic-snapshots.jsonl
          retention-days: 30
