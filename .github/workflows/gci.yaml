# =============================================================================
# GCI: GATED CHECK-IN
# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
# - Runs on every non-draft PR. Fast, opinionated, no knobs.
# - SF10 TPC-DI on every local engine. No cloud engines, so no cloud flakes.
# - Fails unless every engine completes every batch.
# - Need cloud engines or custom settings? Run ci.yaml instead.
# - Do not add knobs here; tune ci.yaml.
# =============================================================================
name: GCI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: gci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  actions: read
  contents: read

jobs:
  benchmark:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci.yaml
    with:
      experiments_file: src/containers/benchmark-server/experiments/gci-sf10-local-engines.json
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
    secrets: inherit