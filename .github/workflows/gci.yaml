name: GCI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      reviewed_pr:
        description: "PR number containing the reviewed benchmark/pin commit"
        required: true
        type: string
      reviewed_sha:
        description: "Exact approved PR head SHA; dispatch ref must resolve to this SHA"
        required: true
        type: string
      experiments_file:
        description: "Path under repo root of a pre-built OAT experiments JSON (overrides the per-knob inputs below if set; e.g. src/containers/benchmark-server/experiments/sf-sweep.json)"
        default: ""
        type: string
      experiments_engines:
        description: "Optional comma-separated engine override for a pre-built experiments file"
        default: ""
        type: string
      scale_factor:
        description: "TPC-DI scale factor"
        default: "10"
        type: string
      benchmark_runs:
        description: "Repeat the full benchmark N times and average timings"
        default: "1"
        type: string
      batch_1_insert_pct:
        description: "% of batch 1 inserts"
        default: "100"
        type: string
      batch_2_insert_pct:
        description: "% of batch 2 inserts"
        default: "1"
        type: string
      batch_3_insert_pct:
        description: "% of batch 3 inserts"
        default: "2"
        type: string
      batch_2_update_pct:
        description: "% of existing staging rows to update before batch 2 insert"
        default: "0"
        type: string
      batch_2_delete_pct:
        description: "% of existing staging rows to delete before batch 2 insert"
        default: "0"
        type: string
      batch_3_update_pct:
        description: "% of existing staging rows to update before batch 3 insert"
        default: "0"
        type: string
      batch_3_delete_pct:
        description: "% of existing staging rows to delete before batch 3 insert"
        default: "0"
        type: string
      parallel:
        description: "Run engines in parallel (0 or 1)"
        default: "0"
        type: string
      schedule:
        description: "Scheduling mode: serial | parallel | serial-host-parallel-cloud"
        default: "serial-host-parallel-cloud"
        type: string
      spark_dbt_threads:
        description: "Cap spark/spark-openivm dbt build concurrency (SPARK_DBT_THREADS). Empty = engine default (30). Mirrors full.json's high-SF gimping."
        default: ""
        type: string
      engines:
        description: "Comma-separated engine list"
        default: "databricks-enzyme,spark,spark-openivm,duckdb,duckdb-openivm,feldera,fabric-jvm-35,fabric-openivm-jvm-35"
        type: string
      preserve_raw:
        description: "Reuse mount/raw/ and mount/bin/ across runs (0 or 1)"
        default: "1"
        type: string
      openivm_validate:
        description: "Opt in to post-batch OpenIVM validation (DuckDB exact; Spark/Fabric digest; 0 or 1)"
        default: "0"
        type: string
      openivm_profile_refresh:
        description: "Export OpenIVM refresh profiling CSVs after each batch (0 or 1)"
        default: "1"
        type: string
      openivm_query_log:
        description: "Export per-MV per-refresh SQL trace (spark-openivm only; 0 or 1)"
        default: "1"
        type: string
      storage_metrics:
        description: "Collect per-engine storage footprint after each batch (0 or 1)"
        default: "1"
        type: string
      oat_min_free_pct:
        description: "Skip remaining OAT experiments when free disk drops below this %"
        default: "10"
        type: string
      timeout_minutes:
        description: "Job timeout in minutes"
        default: "500"
        type: string

concurrency:
  group: gci-${{ github.event.pull_request.number || inputs.reviewed_pr || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  actions: read
  contents: read

jobs:
  review-gate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.review.outputs.allowed }}
      sha: ${{ steps.review.outputs.sha }}
      policy_sha: ${{ steps.policy.outputs.sha }}
    steps:
      - name: Resolve trusted review policy
        uses: actions/github-script@v7
        id: policy
        with:
          script: |
            let sha = context.payload.pull_request?.base.sha;
            if (context.eventName === 'workflow_dispatch') {
              const {data: repo} = await github.rest.repos.get(context.repo);
              const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: repo.default_branch});
              sha = branch.commit.sha;
            }
            if (!/^[0-9a-f]{40}$/.test(sha || '')) throw new Error('Trusted policy SHA unavailable');
            core.setOutput('sha', sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.policy.outputs.sha }}
          path: .gci-trusted
          persist-credentials: false
      - name: Test review admission policy
        run: node --test .gci-trusted/.github/scripts/gci-review-gate.test.cjs
      - uses: actions/github-script@v7
        id: review
        with:
          script: |
            const gate = require('./.gci-trusted/.github/scripts/gci-review-gate.cjs');
            const result = await gate.check({github, context});
            core.setOutput('allowed', String(result.allowed));
            core.setOutput('sha', result.sha || '');
            core.notice(result.reason);

  benchmark:
    needs: review-gate
    if: needs.review-gate.outputs.allowed == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, ivm-bench-azure]
    permissions:
      pull-requests: write
      actions: read
      contents: read
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '500') }}

    env:
      SCALE_FACTOR: ${{ inputs.scale_factor || '10' }}
      BENCHMARK_RUNS: ${{ inputs.benchmark_runs || '1' }}
      BATCH_1_INSERT_PCT: ${{ inputs.batch_1_insert_pct || '100' }}
      BATCH_2_INSERT_PCT: ${{ inputs.batch_2_insert_pct || '1' }}
      BATCH_3_INSERT_PCT: ${{ inputs.batch_3_insert_pct || '2' }}
      BATCH_1_PCT: ${{ inputs.batch_1_insert_pct || '100' }}
      BATCH_2_PCT: ${{ inputs.batch_2_insert_pct || '1' }}
      BATCH_3_PCT: ${{ inputs.batch_3_insert_pct || '2' }}
      BATCH_2_UPDATE_PCT: ${{ inputs.batch_2_update_pct || '0' }}
      BATCH_2_DELETE_PCT: ${{ inputs.batch_2_delete_pct || '0' }}
      BATCH_3_UPDATE_PCT: ${{ inputs.batch_3_update_pct || '0' }}
      BATCH_3_DELETE_PCT: ${{ inputs.batch_3_delete_pct || '0' }}
      PARALLEL: ${{ inputs.parallel || '0' }}
      SCHEDULE: ${{ inputs.schedule || 'serial-host-parallel-cloud' }}
      ENGINES: ${{ inputs.engines || 'databricks-enzyme,spark,spark-openivm,duckdb,duckdb-openivm,feldera,fabric-jvm-35,fabric-openivm-jvm-35' }}
      PRESERVE_RAW: ${{ inputs.preserve_raw || '1' }}
      OPENIVM_VALIDATE: ${{ inputs.openivm_validate || '0' }}
      OPENIVM_PROFILE_REFRESH: ${{ inputs.openivm_profile_refresh || '1' }}
      OPENIVM_QUERY_LOG: ${{ inputs.openivm_query_log || '1' }}
      STORAGE_METRICS: ${{ inputs.storage_metrics || '1' }}
      OAT_MIN_FREE_PCT: ${{ inputs.oat_min_free_pct || '10' }}

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ needs.review-gate.outputs.policy_sha }}
          path: .gci-trusted
          persist-credentials: false

      - name: "Recheck exact review before benchmark work"
        uses: actions/github-script@v7
        with:
          script: |
            const gate = require('./.gci-trusted/.github/scripts/gci-review-gate.cjs');
            const result = await gate.check({github, context});
            if (!result.allowed || result.sha !== '${{ needs.review-gate.outputs.sha }}') {
              throw new Error('Review or PR head changed while waiting for the runner');
            }

      - name: "🧹 Clean Docker-owned files"
        run: |
          sudo rm -rf mount/ 2>/dev/null || true

      - uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ needs.review-gate.outputs.sha }}
          persist-credentials: false

      - name: "🧪 Run storage collector unit tests"
        run: |
          python3 -m unittest discover -s src/containers/dbt-server/tests -v
          python3 -m unittest discover -s src/containers/benchmark-server/tests -v

      - name: "🧬 Resolve experiments file"
        env:
          INPUT_EXPERIMENTS_FILE: ${{ inputs.experiments_file || '' }}
          INPUT_EXPERIMENTS_ENGINES: ${{ inputs.experiments_engines || '' }}
          SPARK_DBT_THREADS_INPUT: ${{ inputs.spark_dbt_threads || '' }}
        run: |
          set -euo pipefail
          REPO_ROOT="$(pwd)"
          INPUT_EXPERIMENTS_FILE="$(bash tools/scripts/github/select-experiments-file.sh)"
          if [[ -n "${INPUT_EXPERIMENTS_FILE}" ]]; then
            EXP_FILE="${INPUT_EXPERIMENTS_FILE}"
            [[ "$EXP_FILE" = /* ]] || EXP_FILE="$REPO_ROOT/$EXP_FILE"
            if [[ ! -f "$EXP_FILE" ]]; then
              echo "ERROR: experiments_file=$EXP_FILE does not exist"
              exit 1
            fi
            echo "Using pre-built experiments file: $EXP_FILE"
            if [[ -n "${INPUT_EXPERIMENTS_ENGINES}" ]]; then
              engines_json="$(printf '%s' "$INPUT_EXPERIMENTS_ENGINES" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')"
              RESOLVED_EXP_FILE="$REPO_ROOT/gci-experiments.json"
              jq --argjson engines "$engines_json" '.baseline.engines = $engines' \
                "$EXP_FILE" > "$RESOLVED_EXP_FILE"
              EXP_FILE="$RESOLVED_EXP_FILE"
              echo "Overrode pre-built experiment engines: $INPUT_EXPERIMENTS_ENGINES"
            fi
          else
            EXP_FILE="$REPO_ROOT/gci-experiments.json"
            engines_json="$(printf '%s' "$ENGINES" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')"
            if [[ -n "${SPARK_DBT_THREADS_INPUT}" && ! "${SPARK_DBT_THREADS_INPUT}" =~ ^[0-9]+$ ]]; then
              echo "ERROR: spark_dbt_threads must be a positive integer (got: ${SPARK_DBT_THREADS_INPUT})"
              exit 1
            fi
            parallel_b=$([[ "$PARALLEL" = "1" ]] && echo true || echo false)
            preserve_raw_b=$([[ "$PRESERVE_RAW" = "1" ]] && echo true || echo false)
            openivm_validate_b=$([[ "$OPENIVM_VALIDATE" = "1" ]] && echo true || echo false)
            openivm_profile_refresh_b=$([[ "$OPENIVM_PROFILE_REFRESH" = "1" ]] && echo true || echo false)
            openivm_query_log_b=$([[ "$OPENIVM_QUERY_LOG" = "1" ]] && echo true || echo false)
            storage_metrics_b=$([[ "$STORAGE_METRICS" = "1" ]] && echo true || echo false)
            jq -n \
              --argjson sf "$SCALE_FACTOR" \
              --arg b1 "$BATCH_1_PCT" \
              --arg b2 "$BATCH_2_PCT" \
              --arg b3 "$BATCH_3_PCT" \
              --arg b2u "$BATCH_2_UPDATE_PCT" \
              --arg b2d "$BATCH_2_DELETE_PCT" \
              --arg b3u "$BATCH_3_UPDATE_PCT" \
              --arg b3d "$BATCH_3_DELETE_PCT" \
              --argjson engines "$engines_json" \
              --arg sdt "$SPARK_DBT_THREADS_INPUT" \
              --argjson parallel "$parallel_b" \
              --arg schedule "$SCHEDULE" \
              --argjson preserve_raw "$preserve_raw_b" \
              --argjson openivm_validate "$openivm_validate_b" \
              --argjson openivm_profile_refresh "$openivm_profile_refresh_b" \
              --argjson openivm_query_log "$openivm_query_log_b" \
              --argjson storage_metrics "$storage_metrics_b" \
              '{
                _design_notes: ["Synthesised by .github/workflows/gci.yaml from per-knob inputs (1-row OAT sweep)."],
                baseline: {
                  engines: $engines,
                  parallel: $parallel,
                  schedule: $schedule,
                  feature_flags: {
                    preserve_raw: $preserve_raw,
                    openivm_validate: $openivm_validate,
                    openivm_profile_refresh: $openivm_profile_refresh,
                    openivm_query_log: $openivm_query_log,
                    storage_metrics: $storage_metrics
                  }
                },
                experiments: [
                  ({
                    label: "gci-sf\($sf)",
                    scale_factor: $sf,
                    batch_1_pct: $b1,
                    batch_2_pct: $b2,
                    batch_3_pct: $b3,
                    batch_2_update_pct: $b2u,
                    batch_2_delete_pct: $b2d,
                    batch_3_update_pct: $b3u,
                    batch_3_delete_pct: $b3d
                  } + (if $sdt != "" then { spark_tunables: { dbt_threads: ($sdt | tonumber) } } else {} end))
                ]
              }' > "$EXP_FILE"
            echo "Synthesised 1-row experiments file: $EXP_FILE"
            cat "$EXP_FILE"
          fi
          echo "BENCHMARK_EXPERIMENTS_FILE=$EXP_FILE" >> "$GITHUB_ENV"

      - name: "🔐 Write .env from BASE64_ENV secret"
        env:
          BASE64_ENV: ${{ secrets.BASE64_ENV }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE64_ENV:-}" ]]; then
            echo "ERROR: BASE64_ENV secret is not set"
            exit 1
          fi
          printf '%s' "$BASE64_ENV" | base64 -d > "$GITHUB_WORKSPACE/.env"
          chmod 600 "$GITHUB_WORKSPACE/.env"
          echo "Wrote $(wc -c < "$GITHUB_WORKSPACE/.env") bytes to .env"

      - name: "🏁 Run benchmark"
        run: bash src/.scripts/benchmark.sh

      - name: "💬 Post PR comment"
        if: github.event.pull_request.number && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash tools/scripts/github/post-pr-comment.sh

      - name: "📦 Upload artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-sf${{ env.SCALE_FACTOR }}
          path: |
            mount/logs/
            mount/results/
            mount/stats/
            mount/query-plan/
            mount/pipeline-events/
            mount/debug/
            mount/oat-state/
            mount/imgs/
            imgs/
            # compiler-bench: per-query results/summary plus the translation
            # report, which carries the per-query reason a query was not
            # expressible in a dialect. Without it a cloud run that fails
            # translation gives only the aggregate count.
            mount/compiler-bench/results/
            mount/compiler-bench/corpus/*/translation.csv
            mount/compiler-bench/corpus/*/meta.json
            mount/compiler-bench/corpus/meta.json
            # cost-model-bench: the per-case CSVs are the entire output of a sweep, and the
            # benchmark flushes a row per completed case, so a shard cut short still has
            # everything it finished.
            mount/cost-model-bench/**
            gci-experiments.json
          if-no-files-found: warn
          retention-days: 30

      - name: "🧹 Docker cleanup"
        if: always()
        run: |
          docker compose -f docker/docker-compose.benchmark-server.yml down --remove-orphans 2>/dev/null || true
          docker system prune -f 2>/dev/null || true
