name: GCI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fabric-relay-diagnostic
  cancel-in-progress: false
jobs:
  relay-diagnostic:
    runs-on: [self-hosted, Linux, X64, ivm-bench-azure]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose existing relay from host and container
        env:
          BASE64_ENV: ${{ secrets.BASE64_ENV }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          task_env="$(mktemp "$RUNNER_TEMP/fabric-relay-env.XXXXXX")"
          trap 'rm -f "$task_env"' EXIT
          printf '%s' "$BASE64_ENV" | base64 -d > "$task_env"
          set -a
          source "$task_env"
          set +a
          unset BASE64_ENV
          export IMDS_RELAY_KEY_NAME="${IMDS_RELAY_KEY_NAME:-Send}"
          python3 tools/scripts/github/diagnose-fabric-relay.py || true
          docker run --rm --pull=missing \
            -e IMDS_RELAY_URL -e IMDS_RELAY_SENDER_KEY -e IMDS_RELAY_KEY_NAME -e UAMI_CLIENT_ID \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work python:3.11-slim \
            python3 tools/scripts/github/diagnose-fabric-relay.py
