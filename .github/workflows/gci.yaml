name: GCI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      scale_factor:
        description: "TPC-DI scale factor"
        default: "3"
        type: string
      batch_1_pct:
        description: "% of batch 1 data"
        default: "1"
        type: string
      batch_2_pct:
        description: "% of batch 2 data"
        default: "0.001"
        type: string
      batch_3_pct:
        description: "% of batch 3 data"
        default: "0.002"
        type: string
      parallel:
        description: "Run engines in parallel (0 or 1)"
        default: "1"
        type: string
      engines:
        description: "Comma-separated engine list"
        default: "spark,duckdb,duckdb-openivm,feldera"
        type: string
      preserve_raw:
        description: "Reuse mount/raw/ and mount/bin/ across runs (0 or 1)"
        default: "0"
        type: string
      openivm_validate:
        description: "Validate OpenIVM views with EXCEPT ALL after each timed batch (0 or 1)"
        default: "0"
        type: string
      timeout_minutes:
        description: "Job timeout in minutes"
        default: "120"
        type: string
      cancel_in_progress:
        description: "Cancel in-progress runs on the same ref"
        default: true
        type: boolean

concurrency:
  group: gci-${{ github.ref }}-${{ inputs.cancel_in_progress == false && github.run_id || 'shared' }}
  cancel-in-progress: ${{ inputs.cancel_in_progress != false }}

permissions:
  pull-requests: write
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: [self-hosted, Linux, X64, ivm-bench-azure]
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '120') }}

    env:
      SCALE_FACTOR: ${{ inputs.scale_factor || '3' }}
      BATCH_1_PCT: ${{ inputs.batch_1_pct || '1' }}
      BATCH_2_PCT: ${{ inputs.batch_2_pct || '0.001' }}
      BATCH_3_PCT: ${{ inputs.batch_3_pct || '0.002' }}
      PARALLEL: ${{ inputs.parallel || '1' }}
      ENGINES: ${{ inputs.engines || 'spark,duckdb,duckdb-openivm,feldera' }}
      PRESERVE_RAW: ${{ inputs.preserve_raw || '0' }}
      OPENIVM_VALIDATE: ${{ inputs.openivm_validate || '0' }}

    steps:
      - name: "🧹 Fresh-host cleanup + sanity check"
        run: |
          set -euo pipefail
          echo "=== Host state BEFORE cleanup ==="
          uname -a
          echo "--- df -h ---"; df -h /
          echo "--- free -h ---"; free -h
          echo "--- swapon ---"; swapon --show || true
          echo "--- docker info ---"; docker info --format \
            'Containers: {{.Containers}}  Images: {{.Images}}  Server: {{.ServerVersion}}  StorageDriver: {{.Driver}}' || true

          echo "=== Killing leftover containers ==="
          if docker ps -aq >/dev/null 2>&1; then
            CONTAINERS=$(docker ps -aq)
            if [ -n "$CONTAINERS" ]; then
              echo "$CONTAINERS" | xargs -r docker rm -f || true
            fi
          fi

          echo "=== Bringing down all ivm-bench compose stacks (best effort) ==="
          for f in docker/docker-compose.benchmark-server.yml \
                   docker/docker-compose.datagen.yml \
                   docker/docker-compose.benchmark.spark.yml \
                   docker/docker-compose.benchmark.duckdb.yml \
                   docker/docker-compose.benchmark.duckdb-openivm.yml \
                   docker/docker-compose.benchmark.feldera.yml; do
            if [ -f "$f" ]; then
              docker compose -f "$f" down --remove-orphans -v 2>/dev/null || true
            fi
          done

          echo "=== Pruning docker (images, build cache, volumes) ==="
          docker system prune -af --volumes 2>/dev/null || true
          docker builder prune -af 2>/dev/null || true

          echo "=== Wiping leftover mount/ + temp dirs ==="
          sudo rm -rf mount/ 2>/dev/null || true
          sudo rm -rf /tmp/ivm-bench-* 2>/dev/null || true

          echo "=== Wiping runner-agent temp/tool dirs (survive actions/checkout clean) ==="
          # actions/checkout `clean: true` only cleans the repo, not the
          # runner agent's _work/_temp / _work/_tool dirs. Those grow
          # across our 5-sequential-run streak and can sap headroom.
          # We only delete siblings of the current repo workspace, never
          # above it, and we hard-guard against an empty RUNNER_WORKSPACE
          # which would otherwise expand to "/..".
          #
          # WARNING: do NOT wipe _work/_actions here. The runner's
          # "Set up job" step downloads JS action code (actions/checkout,
          # actions/upload-artifact, etc.) into _work/_actions BEFORE
          # this cleanup step runs. Wiping it here breaks every
          # subsequent `uses:` step in the same job (run 25856902736
          # failed exactly this way).
          if [ -n "${RUNNER_WORKSPACE:-}" ] && [ -d "${RUNNER_WORKSPACE}" ]; then
            RUNNER_WORK_ROOT="$(dirname "$RUNNER_WORKSPACE")"
            case "$RUNNER_WORK_ROOT" in
              /home/*/actions-runner/_work)
                for sib in _temp _tool; do
                  sudo rm -rf "$RUNNER_WORK_ROOT/$sib" 2>/dev/null || true
                done
                ;;
              *)
                echo "WARNING: RUNNER_WORK_ROOT=$RUNNER_WORK_ROOT doesn't look like an actions-runner _work dir; skipping cleanup"
                ;;
            esac
          fi

          echo "=== Capping journald growth (idempotent) ==="
          # Without bounds, /var/log/journal grows unbounded across 5
          # multi-hour runs as Docker/cron/systemd log heavily. 1 GB is
          # plenty for diagnostics and keeps the OS disk available for
          # DuckDB spill.
          sudo mkdir -p /etc/systemd/journald.conf.d
          printf '[Journal]\nSystemMaxUse=1G\nRuntimeMaxUse=512M\nMaxRetentionSec=7day\n' \
            | sudo tee /etc/systemd/journald.conf.d/99-ivm-bench.conf >/dev/null
          sudo systemctl restart systemd-journald 2>/dev/null || true
          sudo journalctl --vacuum-size=1G >/dev/null 2>&1 || true

          echo "=== Host state AFTER cleanup ==="
          echo "--- df -h ---"; df -h /
          echo "--- free -h ---"; free -h
          echo "--- swapon ---"; swapon --show || true

          # Fail fast on environments that won't survive SF=1000.
          FREE_GB=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          FREE_MEM_GB=$(free -g | awk '/^Mem:/ {print $7}')
          MIN_DISK_GB=1500
          MIN_MEM_GB=180
          echo "Free disk: ${FREE_GB} GB (min ${MIN_DISK_GB} GB)"
          echo "Free mem (available): ${FREE_MEM_GB} GB (min ${MIN_MEM_GB} GB)"
          if [ "${FREE_GB:-0}" -lt "$MIN_DISK_GB" ]; then
            echo "::error::Runner has only ${FREE_GB} GB free disk; needs >= ${MIN_DISK_GB} GB. Aborting."
            exit 1
          fi
          if [ "${FREE_MEM_GB:-0}" -lt "$MIN_MEM_GB" ]; then
            echo "::error::Runner has only ${FREE_MEM_GB} GB available memory; needs >= ${MIN_MEM_GB} GB. Aborting."
            exit 1
          fi
          echo "Host looks healthy. Proceeding."

      - uses: actions/checkout@v4
        with:
          clean: true

      - name: "🏁 Run benchmark"
        run: bash src/.scripts/benchmark.sh

      - name: "💬 Post PR comment"
        if: github.event_name == 'pull_request' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash tools/scripts/github/post-pr-comment.sh

      - name: "🔍 Collect host diagnostics"
        if: always()
        run: |
          # Capture host-level state that mount/logs doesn't include
          # (Docker daemon, kernel, runner agent, systemd). Lands in
          # mount/debug/ which is picked up by the next step's upload.
          # Best-effort: nothing here should fail the job.
          set +e
          DEBUG_DIR="mount/debug/host-${{ env.SCALE_FACTOR }}-${{ github.run_id }}"
          sudo mkdir -p "$DEBUG_DIR" 2>/dev/null || mkdir -p "$DEBUG_DIR"

          echo "--- df -h ---" > "$DEBUG_DIR/df.txt"
          df -h >> "$DEBUG_DIR/df.txt" 2>&1

          echo "--- free -h ---" > "$DEBUG_DIR/free.txt"
          free -h >> "$DEBUG_DIR/free.txt" 2>&1

          echo "--- vmstat 1 5 ---" > "$DEBUG_DIR/vmstat.txt"
          vmstat 1 5 >> "$DEBUG_DIR/vmstat.txt" 2>&1

          echo "--- uname + uptime ---" > "$DEBUG_DIR/host.txt"
          uname -a >> "$DEBUG_DIR/host.txt" 2>&1
          uptime >> "$DEBUG_DIR/host.txt" 2>&1

          echo "--- docker info ---" > "$DEBUG_DIR/docker-info.txt"
          docker info >> "$DEBUG_DIR/docker-info.txt" 2>&1

          echo "--- docker system df ---" > "$DEBUG_DIR/docker-df.txt"
          docker system df -v >> "$DEBUG_DIR/docker-df.txt" 2>&1

          echo "--- docker ps -a ---" > "$DEBUG_DIR/docker-ps.txt"
          docker ps -a >> "$DEBUG_DIR/docker-ps.txt" 2>&1

          # Kernel ring buffer (OOM kills, hardware errors land here)
          sudo dmesg --ctime 2>&1 | tail -500 > "$DEBUG_DIR/dmesg.txt" || true

          # Tail of syslog if accessible (Docker daemon, cron, oom-killer)
          sudo tail -n 1000 /var/log/syslog > "$DEBUG_DIR/syslog.txt" 2>&1 || true

          # journald system journal (Docker / systemd / runner agent)
          sudo journalctl --no-pager --since "8 hours ago" 2>&1 | tail -2000 \
            > "$DEBUG_DIR/journal.txt" || true

          # Per-service journals
          for svc in docker containerd cron systemd-journald; do
            sudo journalctl --no-pager --since "8 hours ago" -u "$svc" 2>&1 | tail -500 \
              > "$DEBUG_DIR/journal-$svc.txt" || true
          done

          # ivm-bench bootstrap + prune logs (created by cloud-init)
          for log in /var/log/ivm-bench-bootstrap.log /var/log/ivm-bench-docker-prune.log; do
            if [ -f "$log" ]; then
              base=$(basename "$log")
              sudo tail -n 500 "$log" > "$DEBUG_DIR/$base" 2>&1 || true
            fi
          done

          # Runner agent _diag logs (most recent only)
          if [ -d "/home/azureuser/actions-runner/_diag" ]; then
            sudo ls -lt /home/azureuser/actions-runner/_diag 2>&1 \
              | head -20 > "$DEBUG_DIR/runner-diag-list.txt" || true
            # Most recent worker log
            LATEST=$(sudo ls -t /home/azureuser/actions-runner/_diag/Worker_*.log 2>/dev/null | head -1)
            if [ -n "$LATEST" ]; then
              sudo tail -n 1000 "$LATEST" > "$DEBUG_DIR/runner-worker-latest.log" 2>&1 || true
            fi
          fi

          # Make sure azureuser can read these from the cleanup step
          sudo chown -R "$(id -u):$(id -g)" "$DEBUG_DIR" 2>/dev/null || true

          echo "Collected $(ls -1 "$DEBUG_DIR" | wc -l) diagnostic files into $DEBUG_DIR:"
          ls -lh "$DEBUG_DIR"

      - name: "📦 Upload artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-sf${{ env.SCALE_FACTOR }}
          path: |
            mount/logs/
            mount/results/${{ env.SCALE_FACTOR }}/dbt-server/
            mount/stats/
            mount/debug/
            imgs/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: "🧹 Post-run aggressive cleanup"
        if: always()
        run: |
          set +e
          echo "=== Host state BEFORE post-run cleanup ==="
          df -h / || true
          free -h || true

          echo "=== Bringing down all ivm-bench compose stacks ==="
          for f in docker/docker-compose.benchmark-server.yml \
                   docker/docker-compose.datagen.yml \
                   docker/docker-compose.benchmark.spark.yml \
                   docker/docker-compose.benchmark.duckdb.yml \
                   docker/docker-compose.benchmark.duckdb-openivm.yml \
                   docker/docker-compose.benchmark.feldera.yml; do
            if [ -f "$f" ]; then
              docker compose -f "$f" down --remove-orphans -v 2>/dev/null || true
            fi
          done

          echo "=== Killing any remaining containers ==="
          if docker ps -aq >/dev/null 2>&1; then
            CONTAINERS=$(docker ps -aq)
            if [ -n "$CONTAINERS" ]; then
              echo "$CONTAINERS" | xargs -r docker rm -f
            fi
          fi

          echo "=== Final docker prune ==="
          docker system prune -af --volumes 2>/dev/null || true
          docker builder prune -af 2>/dev/null || true

          echo "=== Wiping mount/ + temp dirs (mount/benchmark-state preserved) ==="
          # Wipe everything except benchmark-state (which holds the persistent
          # benchmark-server SQLite DB across runs).
          if [ -d mount ]; then
            sudo find mount -mindepth 1 -maxdepth 1 \
                 ! -name 'benchmark-state' -exec rm -rf {} + 2>/dev/null || true
          fi
          sudo rm -rf /tmp/ivm-bench-* 2>/dev/null || true

          echo "=== Wiping runner-agent temp/tool dirs ==="
          if [ -n "${RUNNER_WORKSPACE:-}" ] && [ -d "${RUNNER_WORKSPACE}" ]; then
            RUNNER_WORK_ROOT="$(dirname "$RUNNER_WORKSPACE")"
            case "$RUNNER_WORK_ROOT" in
              /home/*/actions-runner/_work)
                # Same caveat as the pre-run step: _actions is not
                # safe to wipe within a job, and there's no reason to
                # wipe it across jobs either — it's small JS code.
                for sib in _temp _tool; do
                  sudo rm -rf "$RUNNER_WORK_ROOT/$sib" 2>/dev/null || true
                done
                ;;
            esac
          fi

          echo "=== Trim journald to size cap ==="
          sudo journalctl --vacuum-size=1G >/dev/null 2>&1 || true

          echo "=== Host state AFTER post-run cleanup ==="
          df -h / || true
          free -h || true
