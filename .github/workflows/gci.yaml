name: GCI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fabric-history:
    runs-on: [self-hosted, Linux, X64, ivm-bench-azure]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: fabric-history-readonly
      - name: Read existing Fabric sessions (no benchmark)
        env:
          BASE64_ENV: ${{ secrets.BASE64_ENV }}
        working-directory: fabric-history-readonly
        run: python3 tools/scripts/fabric-history-diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-history-diagnostic
          path: fabric-history-readonly/fabric-history-diagnostic.json
          retention-days: 30
