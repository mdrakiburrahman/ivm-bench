# =============================================================================
# GCI: GATED CHECK-IN
# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
# - Runs on non-draft same-repo PRs or on manual dispatch from the default branch.
# - SF10 TPC-DI on every local engine. No cloud engines, so no cloud flakes.
# - Fails unless every engine completes every batch.
# - Need cloud engines or custom settings? Run ci.yaml instead.
# - Do not add knobs here; tune ci.yaml.
# =============================================================================
name: GCI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: gci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('manual-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  actions: read
  contents: write

jobs:
  benchmark:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.repository == 'openivm/ivm-bench' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    uses: ./.github/workflows/ci.yaml
    with:
      experiments_file: src/containers/benchmark-server/experiments/gci-sf10-local-engines.json
      pr_number: ${{ github.event_name == 'pull_request' && format('{0}', github.event.pull_request.number) || '' }}
      publish_dashboard: true
    secrets: inherit