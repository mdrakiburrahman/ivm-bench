services:
  pipeline-manager:
    image: images.feldera.com/feldera/pipeline-manager:latest
    cpus: 32
    mem_limit: 120g
    volumes:
      - ./mount/raw/${SCALE_FACTOR:-3}/delta:/data/raw/delta
      - ./mount/results/${SCALE_FACTOR:-3}/feldera:/data/processed/feldera
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --request GET --url http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  dbt-server:
    build:
      context: ./src/containers/dbt-server
    depends_on:
      pipeline-manager:
        condition: service_healthy
    cpus: 4
    mem_limit: 8g
    ports:
      - "5000:5000"
    environment:
      STATE_DIR: /data/state
      FELDERA_URL: "http://pipeline-manager:8080"
    volumes:
      - ./mount/raw/${SCALE_FACTOR:-3}/delta:/data/raw/delta
      - ./mount/results/${SCALE_FACTOR:-3}/feldera:/data/processed/feldera
      - ./mount/results/${SCALE_FACTOR:-3}/dbt-server:/data/state
    healthcheck:
      test: curl -sf http://localhost:5000/health || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
