services:
  extended-tpcds-datagen:
    build:
      context: ../src/workloads/extended-tpcds
    environment:
      SCALE_FACTOR: "${SCALE_FACTOR}"
      BATCH_1_PCT: "${BATCH_1_PCT}"
      EXTENDED_TPCDS_OPTIONS: "${EXTENDED_TPCDS_OPTIONS}"
      EXTENDED_TPCDS_STEPS: "${EXTENDED_TPCDS_STEPS}"
      DUCKDB_MEM_LIMIT: "${EXTENDED_TPCDS_PREPARE_MEMORY_LIMIT:-32GB}"
      DUCKDB_THREADS: "${EXTENDED_TPCDS_PREPARE_THREADS:-4}"
      DUCKDB_MAX_TEMP_DIRECTORY_SIZE: "${EXTENDED_TPCDS_PREPARE_SPILL_LIMIT:-64GB}"
    volumes:
      - ../mount/raw/${SCALE_FACTOR}/extended-tpcds/${EXTENDED_TPCDS_CACHE_KEY}:/data/output
