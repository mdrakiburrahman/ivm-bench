services:
  mssql-metastore:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: on-failure:3
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Hive@Pass123"
      # Cap SQL Server's internal memory at ~75% of mem_limit to leave
      # headroom for the OS / page cache. Under heavy sustained load
      # the default unconfigured server has been observed to crash with
      # a fatal error (core-dumped) after ~15 minutes at SF=100, and at
      # SF=400 (3x larger validation working set + 30 concurrent Livy
      # threads → ~150+ concurrent metastore RPCs) the older 4-cpu /
      # 8g / 5500MB cap was hitting SOS scheduler
      # ASSERT(seenByMonitor < NonYieldThreshold) (sosschedmon.cpp:202)
      # — symptom of cgroup CPU starvation. Bumped to 8 cpus / 16g /
      # 12000MB to give the scheduler enough headroom across SF=100→1000.
      MSSQL_MEMORY_LIMIT_MB: "12000"
    cpus: ${MSSQL_CPUS:-8}
    mem_limit: ${MSSQL_MEM:-16g}
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Hive@Pass123" -C -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  spark:
    build:
      context: ../src/containers/spark
    depends_on:
      mssql-metastore:
        condition: service_healthy
    cpus: ${SPARK_CPUS:-32}
    mem_limit: ${SPARK_MEM:-120g}
    environment:
      METASTORE_HOST: mssql-metastore
      METASTORE_PORT: "1433"
      SPARK_DRIVER_PCT_RAM: "${SPARK_DRIVER_PCT_RAM:-}"
      SPARK_EXECUTOR_PCT_RAM: "${SPARK_EXECUTOR_PCT_RAM:-}"
      SPARK_SUBMIT_SHUFFLE_PARTITIONS: "${SPARK_SUBMIT_SHUFFLE_PARTITIONS:-}"
      SPARK_SUBMIT_DEFAULT_PARALLELISM: "${SPARK_SUBMIT_DEFAULT_PARALLELISM:-}"
      SPARK_METRICS_CAPTURE: "${SPARK_METRICS_CAPTURE:-1}"
    volumes:
      - ../mount/raw/${SCALE_FACTOR:-3}/delta:/data/raw/delta:ro
      - ../mount/results/${SCALE_FACTOR:-3}/spark:/data/processed/spark
      # compiler-bench TPC-C Parquet. The Spark EXECUTOR reads this path, not the
      # dbt-server, so mounting it on dbt-server alone gives PATH_NOT_FOUND.
      - ../mount/compiler-bench:/data/compiler-bench:ro
      - ../mount/metrics/${SCALE_FACTOR:-3}/spark/spark-events:/data/metrics/spark-events
    healthcheck:
      test: curl -sf http://localhost:8998/sessions || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  dbt-server:
    extends:
      file: docker-compose.base.yml
      service: dbt-server-base
    depends_on:
      spark:
        condition: service_healthy
    cpus: ${DBT_SERVER_CPUS:-4}
    mem_limit: ${DBT_SERVER_MEM:-8g}
    volumes:
      - ../mount/raw/${SCALE_FACTOR:-3}/delta:/data/raw/delta:ro
      - ../mount/results/${SCALE_FACTOR:-3}/spark:/data/processed/spark
      - ../mount/stats/${SCALE_FACTOR:-3}/spark:/data/stats
