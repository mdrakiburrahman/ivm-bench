# DbspNet engine (a .NET DBSP implementation) — the DbspNet control service is the
# pipeline-manager analogue. Unlike Feldera's prebuilt image, DbspNet is built from its
# own repo (default: a sibling checkout at ../../dbspnet relative to this docker/ dir,
# i.e. D:/src/dbsp-net alongside D:/src/ivm-bench). Override DBSPNET_REPO if it lives
# elsewhere. Prerequisite: check out the dbsp-net repo with its engineered-wood submodule
# initialised (`git submodule update --init --recursive`).
services:
  dbspnet-server:
    build:
      context: ${DBSPNET_REPO:-../../dbsp-net}
      dockerfile: src/DbspNet.Server/Dockerfile
    cpus: ${DBSPNET_CPUS:-32}
    mem_limit: ${DBSPNET_MEM:-120g}
    volumes:
      - ../mount/raw/${SCALE_FACTOR:-3}/delta:/data/raw/delta
      - ../mount/results/${SCALE_FACTOR:-3}/dbspnet:/data/processed/dbspnet
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --request GET --url http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  dbt-server:
    extends:
      file: docker-compose.base.yml
      service: dbt-server-base
    depends_on:
      dbspnet-server:
        condition: service_healthy
    cpus: ${DBT_SERVER_CPUS:-4}
    mem_limit: ${DBT_SERVER_MEM:-8g}
    environment:
      DBSPNET_URL: "http://dbspnet-server:8080"
      DBSPNET_PROJECT_DIR: "/app/dbt-projects/dbspnet"
    volumes:
      - ../mount/raw/${SCALE_FACTOR:-3}/delta:/data/raw/delta
      - ../mount/results/${SCALE_FACTOR:-3}/dbspnet:/data/processed/dbspnet
      - ../mount/stats/${SCALE_FACTOR:-3}/dbspnet:/data/stats
