services:
  duckdb-openivm-builder:
    build:
      context: ../src/containers/duckdb-openivm
      args:
        UBUNTU_MIRROR: "${OPENIVM_UBUNTU_MIRROR:-http://archive.ubuntu.com/ubuntu}"
        DUCKDB_OPENIVM_DOCKERFILE_HASH: "${DUCKDB_OPENIVM_DOCKERFILE_HASH:-}"
    volumes:
      - ../mount/bin/duckdb-openivm:/output
    environment:
      OUTPUT_DIR: /output
