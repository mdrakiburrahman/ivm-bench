services:
  dbt-server-base:
    build:
      context: ../src/containers/dbt-server
    ports:
      - "${DBT_SERVER_PORT:-5000}:5000"
    environment:
      WORKLOAD: "${WORKLOAD:-standard}"
      EXTENDED_TPCDS_OPTIONS: "${EXTENDED_TPCDS_OPTIONS:-}"
      EXTENDED_TPCDS_CACHE_KEY: "${EXTENDED_TPCDS_CACHE_KEY:-unused}"
      EXTENDED_TPCDS_WORKLOAD_DIR: /data/workloads/extended-tpcds
      STATE_DIR: /tmp/dbt-state
      STATS_DIR: /data/stats
      SCALE_FACTOR: ${SCALE_FACTOR:-3}
      TPCDI_BATCH_2_DAYS: "${TPCDI_BATCH_2_DAYS:-0}"
      REPEATED_REFRESH: "${REPEATED_REFRESH:-0}"
      TPCDI_WORKLOAD: "${TPCDI_WORKLOAD:-standard}"
      REFRESH_COUNT: "${REFRESH_COUNT:-20}"
      REFRESH_PCT: "${REFRESH_PCT:-1}"
      BATCH_1_INSERT_PCT: "${BATCH_1_INSERT_PCT:-}"
      BATCH_2_INSERT_PCT: "${BATCH_2_INSERT_PCT:-}"
      BATCH_3_INSERT_PCT: "${BATCH_3_INSERT_PCT:-}"
      BATCH_1_PCT: "${BATCH_1_PCT}"
      BATCH_2_PCT: "${BATCH_2_PCT}"
      BATCH_3_PCT: "${BATCH_3_PCT}"
      BATCH_2_UPDATE_PCT: "${BATCH_2_UPDATE_PCT:-0}"
      BATCH_2_DELETE_PCT: "${BATCH_2_DELETE_PCT:-0}"
      BATCH_3_UPDATE_PCT: "${BATCH_3_UPDATE_PCT:-0}"
      BATCH_3_DELETE_PCT: "${BATCH_3_DELETE_PCT:-0}"
      SPARK_DBT_THREADS: "${SPARK_DBT_THREADS:-}"
      DATABRICKS_DBT_THREADS: "${DATABRICKS_DBT_THREADS:-}"
      STORAGE_METRICS: "${STORAGE_METRICS:-1}"
      STORAGE_COLLECTION_TIMEOUT_S: "${STORAGE_COLLECTION_TIMEOUT_S:-}"
    volumes:
      - ../mount/logs/${SCALE_FACTOR:-3}:/data/logs
      # compiler-bench corpus + TPC-C Parquet, prepared once by the
      # benchmark-server. Read-only: results come back over HTTP so the
      # benchmark-server stays the only writer of artifact layout.
      - ../mount/compiler-bench:/data/compiler-bench:ro
      - ../src/workloads/extended-tpcds:/data/workloads/extended-tpcds:ro
      - ../mount/raw/${SCALE_FACTOR:-3}/extended-tpcds:/data/raw/extended-tpcds:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: curl -sf http://localhost:5000/health || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
