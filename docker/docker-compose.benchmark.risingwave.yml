services:
  risingwave:
    image: risingwavelabs/risingwave:${RISINGWAVE_VERSION:-v3.0.2}
    # The tuned config is not optional: with RisingWave's defaults this workload
    # fails on a local volume. See src/containers/risingwave/risingwave.toml for
    # the three defaults it overrides and the failure each one causes.
    command: single_node --config-path /risingwave.toml
    # Matches the other host engines (feldera, duckdb, spark all take 32 cpus /
    # 120g) so cross-engine batch timings are comparable. These were held at
    # 8/32g while the Hummock write-timeout bug was unfixed; risingwave.toml now
    # addresses that directly with 120 s object-store timeouts, so the cap is
    # redundant — and it made RisingWave's batch 1 look far worse than a
    # like-for-like comparison. RisingWave also sizes actor parallelism from the
    # host rather than the cgroup, so an 8-cpu limit left ~24 actors
    # oversubscribed on 8 cores.
    cpus: ${RISINGWAVE_CPUS:-32}
    mem_limit: ${RISINGWAVE_MEM:-120g}
    ports:
      - "4566:4566"
    volumes:
      # RisingWave keeps its own state (hummock object store + meta) here. It
      # never reads the raw Delta payload directly: `file_scan` supports only
      # s3/gcs/azblob and there is no Delta source connector, so the dbt-server
      # streams the data in over pgwire instead.
      - ../mount/results/${SCALE_FACTOR:-3}/risingwave/state:/root/.risingwave
      - ../src/containers/risingwave/risingwave.toml:/risingwave.toml:ro
    healthcheck:
      # A bash TCP probe against the pgwire port, NOT psql: the RisingWave image
      # ships neither psql nor nc, so a psql-based check can never pass and the
      # container stays "health: starting" forever, blocking dbt-server's
      # depends_on until compose times out.
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/4566' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  dbt-server:
    extends:
      file: docker-compose.base.yml
      service: dbt-server-base
    depends_on:
      risingwave:
        condition: service_healthy
    cpus: ${DBT_SERVER_CPUS:-8}
    mem_limit: ${DBT_SERVER_MEM:-16g}
    environment:
      RISINGWAVE_HOST: risingwave
      RISINGWAVE_PORT: "4566"
      RISINGWAVE_USER: root
      RISINGWAVE_DATABASE: dev
      # dbt build concurrency. Unlike duckdb (in-process, parallel via
      # DUCKDB_THREADS) and feldera (one compiled program, so dbt threads do
      # nothing), RisingWave's 49 models are independent CREATE MATERIALIZED VIEW
      # statements and dbt threads is the only thing that lets their backfills
      # overlap. At 1, batch 1 used 3.95 of 8 allocated cores (49 %) — it was
      # serialised, not compute-bound.
      RISINGWAVE_THREADS: "${RISINGWAVE_THREADS:-8}"
      # Backfill parallelism, the documented knob for MV-creation speed. Set here
      # so it can be swept without rebuilding the image. Steady-state parallelism
      # is deliberately left at RisingWave's default so batches 2/3 stay
      # comparable with earlier runs.
      RISINGWAVE_BACKFILL_PARALLELISM: "${RISINGWAVE_BACKFILL_PARALLELISM:-16}"
    volumes:
      - ../mount/raw/${SCALE_FACTOR:-3}/delta:/data/raw/delta:ro
      - ../mount/results/${SCALE_FACTOR:-3}/risingwave:/data/processed/risingwave
      - ../mount/stats/${SCALE_FACTOR:-3}/risingwave:/data/stats
