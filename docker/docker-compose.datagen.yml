services:
  iceberg-minio:
    profiles: ["iceberg"]
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${RISINGWAVE_S3_ACCESS_KEY:-ivmbench}
      MINIO_ROOT_PASSWORD: ${RISINGWAVE_S3_SECRET_KEY:-ivmbench-secret}
    volumes:
      - ../mount/raw/${SCALE_FACTOR:-3}/iceberg:/data
    cpus: ${MINIO_CPUS:-4}
    mem_limit: ${MINIO_MEM:-4g}

  tpc-di-gen:
    build:
      context: ../src/containers/tpc-di-gen
    cpus: ${DATAGEN_CPUS:-32}
    mem_limit: ${DATAGEN_MEM:-128g}
    volumes:
      - ../mount/datagen-cache/${SCALE_FACTOR:-3}/digen:/data/digen
    environment:
      DIGEN_PATH: /data/digen
      SCALE_FACTOR: "${SCALE_FACTOR:-3}"
      REPEATED_REFRESH: "${REPEATED_REFRESH:-0}"
      DIGEN_INCREMENTAL_BATCHES: "${DIGEN_INCREMENTAL_BATCHES:-2}"
      DIGEN_TIMEOUT: "${DIGEN_TIMEOUT:-7200}"

  spark-digen-delta:
    build:
      context: ../src/containers/spark-digen-delta
      args:
        SBT_IMAGE: "sbtscala/scala-sbt:eclipse-temurin-17.0.15_6_1.12.6_2.12.21"
        SPARK_VERSION: "3.5.8"
        SCALA_VERSION: "2.12.18"
        DELTA_VERSION: "3.3.2"
        HADOOP_VERSION: "3.3.4"
    cpus: ${DATAGEN_CPUS:-32}
    mem_limit: ${DATAGEN_MEM:-128g}
    volumes:
      - ../mount/datagen-cache/${SCALE_FACTOR:-3}/digen:/data/digen:ro
      - ../mount/raw/${SCALE_FACTOR:-3}/delta:/data/delta
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Xmx${DATAGEN_HEAP:-80g} -Xms${DATAGEN_HEAP:-80g} -XX:G1HeapRegionSize=16m -XX:ParallelGCThreads=8 -XX:ConcGCThreads=4"
      DIGEN_PATH: /data/digen
      DELTA_PATH: /data/delta
      DATAGEN_OUTPUT_FORMATS: "${DATAGEN_OUTPUT_FORMATS:-delta}"
      ICEBERG_S3_ENDPOINT: http://iceberg-minio:9000
      ICEBERG_S3_ACCESS_KEY: "${RISINGWAVE_S3_ACCESS_KEY:-ivmbench}"
      ICEBERG_S3_SECRET_KEY: "${RISINGWAVE_S3_SECRET_KEY:-ivmbench-secret}"
      ICEBERG_S3_BUCKET: ivm-bench
      TPCDI_BATCH_2_DAYS: "${TPCDI_BATCH_2_DAYS:-0}"
      REPEATED_REFRESH: "${REPEATED_REFRESH:-0}"
      TPCDI_WORKLOAD: "${TPCDI_WORKLOAD:-standard}"
      REFRESH_COUNT: "${REFRESH_COUNT:-20}"
      REFRESH_PCT: "${REFRESH_PCT:-1}"
      DIGEN_INCREMENTAL_BATCHES: "${DIGEN_INCREMENTAL_BATCHES:-2}"
      BATCH_1_INSERT_PCT: "${BATCH_1_INSERT_PCT:-}"
      BATCH_2_INSERT_PCT: "${BATCH_2_INSERT_PCT:-}"
      BATCH_3_INSERT_PCT: "${BATCH_3_INSERT_PCT:-}"
      BATCH_1_PCT: "${BATCH_1_PCT}"
      BATCH_2_PCT: "${BATCH_2_PCT}"
      BATCH_3_PCT: "${BATCH_3_PCT}"
    depends_on:
      tpc-di-gen:
        condition: service_completed_successfully
