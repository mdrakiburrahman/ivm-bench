services:
  pipeline-manager:
    image: images.feldera.com/feldera/pipeline-manager:latest
    cpus: ${FELDERA_CPUS:-32}
    mem_limit: ${FELDERA_MEM:-120g}
    volumes:
      - ../mount/raw/${SCALE_FACTOR:-3}/delta:/data/raw/delta
      - ../mount/results/${SCALE_FACTOR:-3}/feldera:/data/processed/feldera
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --request GET --url http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  dbt-server:
    extends:
      file: docker-compose.base.yml
      service: dbt-server-base
    depends_on:
      pipeline-manager:
        condition: service_healthy
    cpus: ${DBT_SERVER_CPUS:-4}
    mem_limit: ${DBT_SERVER_MEM:-8g}
    environment:
      FELDERA_URL: "http://pipeline-manager:8080"
      FELDERA_MAX_RSS_MB: "${FELDERA_MAX_RSS_MB:-0}"
      FELDERA_POLL_TIMEOUT_S: "${FELDERA_POLL_TIMEOUT_S:-36000}"
    volumes:
      - ../mount/raw/${SCALE_FACTOR:-3}/delta:/data/raw/delta
      - ../mount/results/${SCALE_FACTOR:-3}/feldera:/data/processed/feldera
      - ../mount/stats/${SCALE_FACTOR:-3}/feldera:/data/stats
