services:
  dbt-server-base:
    build:
      context: ./src/containers/dbt-server
    ports:
      - "${DBT_SERVER_PORT:-5000}:5000"
    environment:
      STATE_DIR: /tmp/dbt-state
      STATS_DIR: /data/stats
      SCALE_FACTOR: ${SCALE_FACTOR:-3}
      BATCH_1_PCT: "${BATCH_1_PCT}"
      BATCH_2_PCT: "${BATCH_2_PCT}"
      BATCH_3_PCT: "${BATCH_3_PCT}"
    volumes:
      - ./mount/logs/${SCALE_FACTOR:-3}:/data/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: curl -sf http://localhost:5000/health || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
