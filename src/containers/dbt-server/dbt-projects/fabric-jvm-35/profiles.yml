tpcdi:
  target: fabric-jvm-35
  outputs:
    fabric-jvm-35:
      type: fabricspark
      method: livy
      livy_mode: fabric
      endpoint: "{{ env_var('FABRIC_API_BASE', 'https://api.fabric.microsoft.com') }}/v1"
      workspaceid: "{{ env_var('FABRIC_WORKSPACE_ID', 'b161bf3f-2f28-451f-8a5d-420c47164f2e') }}"
      lakehouseid: "{{ env_var('FABRIC_LAKEHOUSE_ID', '8fbe7e88-389c-414e-90fa-982c6bbde39c') }}"
      lakehouse: "{{ env_var('FABRIC_LAKEHOUSE_NAME', 'jvm_35') }}"
      schema: "{{ env_var('FABRIC_LAKEHOUSE_NAME', 'jvm_35') }}"
      authentication: CLI
      high_concurrency: false
      reuse_session: true
      session_id_file: /tmp/fabric-jvm-35-livy.session-id
      connect_retries: 25
      connect_timeout: 10
      session_start_timeout: 900
      statement_timeout: 43200
      retry_all: false
      threads: "{{ (env_var('SPARK_DBT_THREADS', '') or '30') | int }}"
      spark_config:
        name: dbt-tpcdi-fabric-jvm-35
        conf:
          # Bind the baseline Fabric Environment for shared-nothing isolation
          # (its own Spark pool/runtime). Attach-only: the dbt-server pushes no
          # JAR and no config to it — you own its config in the Fabric UI.
          spark.fabric.environmentDetails: '{"id": "{{ env_var(''FABRIC_ENVIRONMENT_ID'', ''32f913be-0ebc-4cf6-872f-4dc7ab383aca'') }}"}'
