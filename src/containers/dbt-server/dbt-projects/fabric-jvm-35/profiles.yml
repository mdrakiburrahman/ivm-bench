tpcdi:
  target: fabric-jvm-35
  outputs:
    fabric-jvm-35:
      type: fabricspark
      method: livy
      livy_mode: fabric
      endpoint: "{{ env_var('FABRIC_API_BASE', 'https://api.fabric.microsoft.com') }}/v1"
      workspaceid: "{{ env_var('FABRIC_WORKSPACE_ID', 'b161bf3f-2f28-451f-8a5d-420c47164f2e') }}"
      lakehouseid: "{{ env_var('FABRIC_LAKEHOUSE_ID', '') }}"
      lakehouse: "{{ env_var('FABRIC_LAKEHOUSE_NAME', '') }}"
      schema: "{{ env_var('FABRIC_LAKEHOUSE_NAME', '') }}"
      authentication: CLI
      high_concurrency: false
      reuse_session: true
      session_id_file: /tmp/fabric-jvm-35-livy.session-id
      connect_retries: 25
      connect_timeout: 10
      session_start_timeout: 900
      statement_timeout: 43200
      retry_all: false
      threads: "{{ (env_var('SPARK_DBT_THREADS', '') or '30') | int }}"
      spark_config:
        name: dbt-tpcdi-fabric-jvm-35
        conf:
          # Bind this run's freshly-provisioned baseline Fabric Environment for
          # shared-nothing compute isolation. The compute lakehouse + environment
          # are created per run (fabric.provision_run) and their IDs are injected
          # into this dbt process by dbt_runner from /tmp/fabric-resolved.json.
          spark.fabric.environmentDetails: '{"id": "{{ env_var(''FABRIC_ENVIRONMENT_ID'', '''') }}"}'
