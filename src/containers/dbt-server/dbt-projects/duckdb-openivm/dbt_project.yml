name: 'tpcdi'
version: '1.0.0'
config-version: 2

profile: 'tpcdi'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
test-paths: ["tests"]

clean-targets:
  - "target"
  - "dbt_packages"

dispatch:
  - macro_namespace: dbt_utils
    search_order: ["tpcdi", "dbt_utils"]

on-run-start:
  - "{{ openivm_setup() }}"

models:
  tpcdi:
    bronze:
      +schema: bronze
      +materialized: materialized_view
    silver:
      +schema: silver
      +materialized: materialized_view
    gold:
      +schema: gold
      +materialized: materialized_view
      analytics:
        +materialized: table
    work:
      +schema: work
      +materialized: ephemeral
