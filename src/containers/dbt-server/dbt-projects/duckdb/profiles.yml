tpcdi:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: ':memory:'
      database: ducklake
      threads: 1
      config_options:
        allow_unsigned_extensions: true
      settings:
        preserve_insertion_order: false
        memory_limit: '115GB'
        threads: 32
      extensions:
        - parquet
        - sqlite
        - delta
        - ducklake
        - name: delta_export
          repo: community
      attach:
        - path: "ducklake:sqlite:/data/processed/duckdb/metadata.db"
          alias: ducklake
          options:
            data_path: /data/processed/duckdb
            data_inlining_row_limit: 0
