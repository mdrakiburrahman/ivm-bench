tpcdi:
  target: spark-openivm
  outputs:
    spark-openivm:
      type: fabricspark
      method: livy
      livy_mode: local
      livy_url: "http://spark-openivm:8998"
      session_id_file: /tmp/spark-openivm-livy.session-id
      host: spark-openivm
      connect_retries: 25
      connect_timeout: 10
      lakehouse: tpcdi
      schema: tpcdi
      # 30 concurrent threads would fan out 30 OpenIvmCompiler subprocesses
      # on the driver. Throttle to 8 for stability.
      threads: 8
      retry_all: true
      spark_config:
        name: dbt-tpcdi-spark-openivm
