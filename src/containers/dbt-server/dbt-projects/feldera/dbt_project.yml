name: tpcdi
version: 1.0.0
config-version: 2
profile: tpcdi
model-paths:
- models
seed-paths:
- seeds
macro-paths:
- macros
snapshot-paths:
- snapshots
analysis-paths:
- analyses
test-paths:
- tests
clean-targets:
- target
- dbt_packages
quoting:
  identifier: true
dispatch:
- macro_namespace: dbt_utils
  search_order:
  - tpcdi
  - dbt_utils
models:
  tpcdi:
    sources:
      +materialized: table
      staging_cash_transaction:
        +connectors:
        - transport:
            name: delta_table_input
            config:
              uri: /data/raw/delta/staging/cash_transaction
              mode: snapshot_and_follow
              transaction_mode: always
              num_parsers: 8
              max_concurrent_readers: 35
          name: staging_cash_transaction_input
      staging_daily_market:
        +connectors:
        - transport:
            name: delta_table_input
            config:
