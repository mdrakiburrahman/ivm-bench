name: 'tpcdi'
version: '1.0.0'
config-version: 2

profile: 'tpcdi'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
test-paths: ["tests"]

clean-targets:
  - "target"
  - "dbt_packages"

dispatch:
  - macro_namespace: dbt_utils
    search_order: ["tpcdi", "dbt_utils"]

models:
  tpcdi:
    # Every layer is a RisingWave MATERIALIZED VIEW: that IS the incremental
    # view maintenance under test. Appending a batch to the source tables
    # propagates through the whole DAG with no REFRESH call — unlike the
    # DuckDB/Spark projects, where these same layers are `table` and get fully
    # recomputed. `work` stays ephemeral so dbt inlines it as a CTE.
    bronze:
      +schema: bronze
      +materialized: materialized_view
      +sql_header: |
        SET enable_locality_backfill = {{ env_var('RISINGWAVE_LOCALITY_BACKFILL', 'true') }};
        SET streaming_join_encoding = '{{ env_var('RISINGWAVE_JOIN_ENCODING', 'cpu_optimized') }}';
    silver:
      +schema: silver
      +materialized: materialized_view
      +sql_header: |
        SET enable_locality_backfill = {{ env_var('RISINGWAVE_LOCALITY_BACKFILL', 'true') }};
        SET streaming_join_encoding = '{{ env_var('RISINGWAVE_JOIN_ENCODING', 'cpu_optimized') }}';
    gold:
      +schema: gold
      +materialized: materialized_view
      +sql_header: |
        SET enable_locality_backfill = {{ env_var('RISINGWAVE_LOCALITY_BACKFILL', 'true') }};
        SET streaming_join_encoding = '{{ env_var('RISINGWAVE_JOIN_ENCODING', 'cpu_optimized') }}';
    work:
      +schema: work
      +materialized: ephemeral
